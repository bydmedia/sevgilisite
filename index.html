<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sevgiliye Özel — Kişiye Özel Aşk Sitesi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&family=Dancing+Script:wght@600;700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.1/cropper.min.css" />

<style>
  :root{
    --wine-950:#1c0c12;
    --wine-900:#2a1019;
    --wine-800:#3a1622;
    --rose-300:#e8b4b8;
    --gold-400:#c9a15a;
    --gold-300:#dcb772;
    --cream-100:#f6ecdf;
    --cream-200:#efe1cd;
    --ink-muted:#c9a9ab;
    --shadow-deep: 0 30px 60px -20px rgba(0,0,0,.6);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'Manrope',sans-serif;
    background:var(--wine-950);
    color:var(--cream-100);
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  .hidden{display:none !important;}

  /* ---------- BUILDER (FORM) VIEW ---------- */
  #builder{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:48px 20px;
    background:
      radial-gradient(1100px 600px at 15% -10%, rgba(201,161,90,.10), transparent 60%),
      radial-gradient(900px 500px at 100% 110%, rgba(232,180,184,.10), transparent 55%),
      var(--wine-950);
  }
  .builder-wrap{width:100%;max-width:560px;}
  .eyebrow{
    font-size:13px;
    letter-spacing:.03em;
    color:var(--gold-300);
    margin:0 0 10px;
  }
  h1.title{
    font-family:'Cormorant Garamond',serif;
    font-weight:600;
    font-size:clamp(34px,6vw,46px);
    line-height:1.08;
    margin:0 0 14px;
    color:var(--cream-100);
  }
  h1.title em{font-style:italic;color:var(--rose-300);}
  .lede{
    color:var(--ink-muted);
    font-size:15.5px;
    line-height:1.6;
    margin:0 0 34px;
    max-width:46ch;
  }
  form.card{
    background:linear-gradient(180deg, rgba(255,255,255,.035), rgba(255,255,255,.015));
    border:1px solid rgba(255,255,255,.08);
    border-radius:18px;
    padding:30px;
    box-shadow:var(--shadow-deep);
  }
  .field{margin-bottom:20px;}
  .field label{
    display:block;
    font-size:13px;
    font-weight:600;
    color:var(--gold-300);
    margin-bottom:8px;
  }
  .field .hint{
    display:block;
    font-weight:400;
    color:var(--ink-muted);
    font-size:12px;
    margin-top:5px;
  }
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  input[type=text], input[type=date], input[type=url], textarea{
    width:100%;
    padding:12px 14px;
    background:rgba(0,0,0,.22);
    border:1px solid rgba(255,255,255,.12);
    border-radius:10px;
    color:var(--cream-100);
    font-family:'Manrope',sans-serif;
    font-size:14.5px;
    outline:none;
    transition:border-color .15s ease;
  }
  textarea{ resize:vertical; min-height:80px; }
  input::placeholder, textarea::placeholder{color:rgba(246,236,223,.35);}
  input:focus, textarea:focus{border-color:var(--gold-400);}
  
  .file-drop{
    border:1.5px dashed rgba(255,255,255,.18);
    border-radius:12px;
    padding:16px;
    text-align:center;
    cursor:pointer;
    color:var(--ink-muted);
    font-size:13.5px;
    background:rgba(0,0,0,.15);
    transition:all .15s ease;
    position:relative;
    display:block;
  }
  .file-drop:hover{border-color:var(--gold-400);color:var(--cream-200);}
  .file-drop input[type=file]{ position:absolute;inset:0;opacity:0;cursor:pointer; }
  .file-drop.has-file{border-style:solid;border-color:var(--gold-400);color:var(--cream-100); background:rgba(201,161,90,0.1);}
  
  .submit-btn{
    width:100%; padding:15px; margin-top:6px; border:none; border-radius:12px;
    background:linear-gradient(180deg, var(--gold-300), var(--gold-400));
    color:#241019; font-family:'Manrope',sans-serif; font-weight:700; font-size:15px;
    cursor:pointer; letter-spacing:.01em;
  }
  .submit-btn:disabled{opacity:.6;cursor:wait;}
  .submit-btn:hover{filter:brightness(1.04);}
  .err{ color:#f0a3a3; font-size:12.5px; margin-top:6px; display:none; }
  .err.show{display:block;}

  /* ---------- CROPPER MODAL ---------- */
  #cropModal{
    position:fixed; inset:0; background:rgba(0,0,0,0.98); z-index:9999;
    display:flex; flex-direction:column;
  }
  .cropper-header {
    background: #1c0c12; padding: 20px 15px; text-align: center; border-bottom: 1px solid rgba(255,255,255,0.1);
  }
  .cropper-title {
    display: block; color: var(--gold-300); font-size: 14px; font-weight: 600; margin-bottom: 12px;
  }
  .cropper-ratios {
    display: flex; gap: 8px; justify-content: center; flex-wrap: wrap;
  }
  .cropper-ratios button {
    background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.15);
    color: var(--cream-100); padding: 8px 14px; border-radius: 8px;
    font-family: 'Manrope', sans-serif; font-size: 13px; font-weight: 500; cursor: pointer; transition: all 0.2s ease;
  }
  .cropper-ratios button.active {
    background: rgba(201,161,90,0.15); border-color: var(--gold-400); color: var(--gold-400); font-weight:700;
  }
  .cropper-area{ flex:1; min-height:0; display:flex; align-items:center; justify-content:center; }
  .cropper-area img{ max-width:100%; max-height:100%; display:block; }
  .cropper-actions{
    padding:20px; background:#1c0c12; display:flex; gap:12px; border-top:1px solid rgba(255,255,255,0.1);
  }
  .cropper-actions button{
    flex:1; padding:15px; border-radius:10px; border:none; font-family:'Manrope',sans-serif;
    font-weight:700; font-size:15px; cursor:pointer;
  }
  #cropCancel{ background:rgba(255,255,255,0
